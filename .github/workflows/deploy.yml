name: Deploy Backend to Droplet

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t bolor4821/wearn-backend:latest -f backend/Dockerfile backend

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Tag Docker image
        run: docker tag wearn-backend ${{ secrets.DOCKER_USERNAME }}/wearn-backend:latest

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/wearn-backend:latest

      - name: Deploy on Droplet via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/wearn-backend:latest
            docker stop wearn-backend || true
            docker rm wearn-backend || true
            docker run -d \
              --name wearn-backend \
              --restart unless-stopped \
              -p 5000:5000 \
              --env-file /root/.env \
              ${{ secrets.DOCKER_USERNAME }}/wearn-backend:latest